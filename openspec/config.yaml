schema: spec-driven

context: |
  Wimamp is a keyboard-first, offline music player for local files. It is a personal, open-source project.
  Tech stack: Go, one binary for macOS, Linux and Windows. mpv is the playback engine and runs as the background daemon, controlled over its JSON IPC socket (a Unix socket, or a named pipe on Windows). The TUI uses Bubbletea. The planned popup window uses Ebitengine, and its file picker uses ncruces/zenity.
  Principles: keep it small, with only the features a player needs. Wimamp defines no global hotkeys; it exposes CLI commands for i3, Hammerspoon, Raycast, AutoHotkey and similar tools to bind.
  Markdown: never hard-wrap prose. One paragraph is one line.

