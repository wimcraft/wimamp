name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          # macOS and Windows build without cgo; the Linux window needs cgo + X11, so it builds natively
          - { runner: macos-latest, goos: darwin, goarch: arm64, cgo: "0" }
          - { runner: macos-latest, goos: darwin, goarch: amd64, cgo: "0" }
          - { runner: ubuntu-latest, goos: linux, goarch: amd64, cgo: "1" }
          - { runner: ubuntu-24.04-arm, goos: linux, goarch: arm64, cgo: "1" }
          - { runner: ubuntu-latest, goos: windows, goarch: amd64, cgo: "0", ext: .exe }
          - { runner: ubuntu-latest, goos: windows, goarch: arm64, cgo: "0", ext: .exe }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - if: matrix.goos == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libc6-dev libgl1-mesa-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev libxxf86vm-dev libasound2-dev pkg-config
      - name: build
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "dist/wimamp-${GOOS}-${GOARCH}${{ matrix.ext }}" .
      - uses: actions/upload-artifact@v4
        with:
          name: wimamp-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: cd dist && sha256sum wimamp-* > checksums.txt && cat checksums.txt
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
